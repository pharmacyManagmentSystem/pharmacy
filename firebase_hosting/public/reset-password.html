<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  
    // Firebase configuration for pharm-e6550 project
    const firebaseConfig = {
      apiKey: "AIzaSyDusTKIHZaMoXtWBSlwZHRKL6wBH0JZ55M",
      authDomain: "pharm-e6550.firebaseapp.com",
      projectId: "pharm-e6550",
      storageBucket: "pharm-e6550.firebasestorage.app",
    };
  
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
  
    const params = new URLSearchParams(window.location.search);
    const oobCode = params.get("oobCode");
  
    const emailText = document.getElementById("emailText");
    const messageDiv = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const spinner = document.getElementById("spinner");
  
    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message show ${type}`;
    }
  
    function setLoading(loading) {
      submitBtn.disabled = loading;
      spinner.style.display = loading ? 'block' : 'none';
      btnText.textContent = loading ? 'Updating...' : 'Update Password';
    }
  
    // Strong password validation
    function isStrongPassword(password) {
      const minLength = password.length >= 8;
      const hasUpper = /[A-Z]/.test(password);
      const hasLower = /[a-z]/.test(password);
      const hasNumber = /[0-9]/.test(password);
      const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
      return minLength && hasUpper && hasLower && hasNumber && hasSpecial;
    }
  
    if (!oobCode) {
      showMessage("Invalid or missing link.", "error");
      submitBtn.disabled = true;
    } else {
      verifyPasswordResetCode(auth, oobCode)
        .then((email) => {
          emailText.textContent = "Resetting password for account: " + email;
          emailText.style.display = "block";
        })
        .catch(() => {
          showMessage("Link expired or invalid. Please request a new reset email.", "error");
          submitBtn.disabled = true;
        });
    }
  
    window.onSubmitNewPassword = async function () {
      const newPassword = document.getElementById("password").value;
  
      if (!isStrongPassword(newPassword)) {
        showMessage(
          "Password must have at least 8 characters, one uppercase, one lowercase, one number, and one special character.",
          "error"
        );
        return;
      }
  
      setLoading(true);
  
      try {
        await confirmPasswordReset(auth, oobCode, newPassword);
        showMessage("✅ Password changed successfully! You can now log in.", "success");
        submitBtn.disabled = true;
        document.getElementById("password").disabled = true;
      } catch (error) {
        console.error(error);
        showMessage("Error while changing password, please try again.", "error");
        setLoading(false);
      }
    };
  
    // Show/hide password toggle
    window.togglePassword = function() {
      const passwordInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eyeIcon");
  
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
      } else {
        passwordInput.type = "password";
        eyeIcon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
      }
    };
  </script>
